{% comment %}
    Closing call to action on the brand green.
    Parameters: heading, text, button (label), interest (pre-selects the contact form choice).
{% endcomment %}
<section class="cta-band">
  <div class="content">
    <h2>{{ heading }}</h2>
    <p>{{ text }}</p>
    <div class="cta-actions">
      <a href="{% url 'kontakt' %}{% if interest %}?interesse={{ interest }}{% endif %}" class="button">{{ button }} {% include 'core/arrow.svg' %}</a>
      <a href="tel:{{ business.phone }}" class="phone">eller ring {{ business.phone_display }}</a>
    </div>
  </div>
</section>
