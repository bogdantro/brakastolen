{% extends 'dashboard/base.html' %}
{% block title %}Logg inn{% endblock %}

{% block content %}
<section class="login">
  <h1>Logg inn</h1>
  <p>Dashbordet for {{ business.name }}.</p>
  {% if error %}<p class="message error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" class="stack">
    {% csrf_token %}
    <label for="{{ form.username.id_for_label }}">Brukernavn</label>
    {{ form.username }}
    <label for="{{ form.password.id_for_label }}">Passord</label>
    {{ form.password }}
    <button type="submit" class="button">Logg inn</button>
  </form>
</section>
{% endblock %}
